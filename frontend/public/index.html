    <!-- JSON-LD : Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ConstruPilot",
      "alternateName": "CMRENOV Travaux AI",
      "url": "https://construpilot.pt",
      "logo": "https://construpilot.pt/logo512.png",
      "description": "Assistente IA para a estimativa, a comparação de preços de materiais e a geração de orçamentos na construção.",
      "foundingDate": "2026",
      "areaServed": {
        "@type": "Country",
        "name": "Portugal"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": ["Portuguese", "English"]
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD : SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ConstruPilot",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Construction Estimating Software",
      "operatingSystem": "Web",
      "url": "https://construpilot.pt",
      "description": "Software de orçamentos de obras e estimativa de remodelação online. Medição 2D automática, render 3D com IA, comparador de preços de materiais, cálculo estrutural (Eurocódigos com Anexos Nacionais portugueses).",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "description": "Versão gratuita disponível"
      },
      "featureList": [
        "Estimativa IA detalhada por capítulo",
        "Calculadoras de materiais (tinta, azulejo, pladur, betão, isolamento)",
        "Comparador de preços de materiais (recolha em direto nas lojas)",
        "Medição 2D automática (deteção de paredes OpenCV)",
        "Render 3D com IA (isométrico, fotorrealista, interior)",
        "Cálculo de escadas e estruturas (NP EN 1990/1992/1997)",
        "Orçamentos PDF com IVA português (6 % reabilitação, 23 % taxa normal)",
        "Assinatura eletrónica do cliente",
        "Acompanhamento de abertura / lembretes automáticos",
        "Coach IA de obras"
      ]
    }
    </script>

    <!-- JSON-LD : WebSite (Sitelinks Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://construpilot.pt",
      "name": "ConstruPilot",
      "inLanguage": "pt-PT",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://construpilot.pt/prix?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <body>
    <div id="root">
      <!-- Ecrã de carregamento neutro apresentado antes da hidratação React. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#ffffff;font-family:'Outfit',system-ui,sans-serif">
        <img src="%PUBLIC_URL%/construpilot-icon.png" alt="ConstruPilot" width="56" height="56" style="border-radius:12px" />
        <div style="width:34px;height:34px;border:3px solid #FFE0CF;border-top-color:#FF5A00;border-radius:50%;animation:cp-spin .8s linear infinite"></div>
      </div>
      <style>@keyframes cp-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <noscript>
      ConstruPilot — o assistente IA da construção: orçamentos de obras, estimativa de remodelação, medições automáticas a partir das suas plantas DWG/DXF/PDF, comparador de preços de materiais e emissão de orçamentos para clientes. Visite https://construpilot.pt para criar um orçamento gratuito. (Ative o JavaScript para a experiência interativa completa.)
    </noscript>
    <script src="/construpilot-websummit-popup.js" defer></script>
