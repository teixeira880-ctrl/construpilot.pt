<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--acc:#203B2D;--ink:#16202a;--mut:#5f6b77;--line:#dfe4e9}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#f3f5f7}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--acc);color:#fff;flex-wrap:wrap}
header b{font-size:15px}header span{opacity:.8;font-size:12.5px}header .kpi{margin-left:auto;font-variant-numeric:tabular-nums}
#v3d{position:absolute;inset:48px 0 0 0}#v3d canvas{display:block;touch-action:none}
details{position:absolute;left:10px;top:58px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-width:270px}
summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--mut)}
.camadas{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:6px 0 8px}
label{font-size:12.5px;display:flex;gap:6px;align-items:center}input[type=range]{width:100%}
.row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer}
#info{position:absolute;right:10px;bottom:10px;background:rgba(22,32,42,.92);color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;max-width:320px}
small{color:#c9d3dc}
@media (max-width:760px){header .kpi{margin-left:0;width:100%}#v3d{inset:70px 0 0 0}details{top:80px;right:10px;max-width:none}}
</style>
</head>
<body>
<header><b>__TITLE__</b><span>__SUB__</span><span class="kpi">__KPI__</span></header>
<div id="v3d"></div>
<details id="ctrl" open><summary>__T_CAMADAS__</summary>
<div class="camadas">
<label><input type="checkbox" id="cam-paredes" checked>__T_ESTRUTURA__</label>
<label><input type="checkbox" id="cam-lajes" checked>__T_PISO__</label>
<label><input type="checkbox" id="cam-cobertura" checked>__T_COB__</label>
<label><input type="checkbox" id="cam-vigas" checked>GL</label>
</div>
<small style="color:var(--mut)">__T_CORTE__ · <span id="corteVal"></span></small>
<input type="range" id="corte" min="0" max="9000" step="50" value="9000">
<div class="row"><button data-vista="iso">Iso</button><button data-vista="frente">__T_FRENTE__</button><button data-vista="lado">__T_LADO__</button><button data-vista="topo">__T_TOPO__</button></div>
</details>
<div id="info" hidden></div>
<script>window.CLT=/*CLT_DATA*/null;</script>
<script>/*APP*/</script>
</body>
</html>
