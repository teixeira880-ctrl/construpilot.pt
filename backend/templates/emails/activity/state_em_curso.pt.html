<!DOCTYPE html>
<html lang="pt-PT">
<head><meta charset="UTF-8"><title>O seu pedido está em análise</title></head>
<body style="font-family: -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7f9;margin:0;padding:24px;color:#1a1a1a;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
    <h1 style="margin:0 0 12px;font-size:20px;color:#0b4b2e;">Olá {{nome}},</h1>
    <p style="margin:0 0 16px;line-height:1.55;">
      Confirmamos a recepção do seu pedido na <strong>ConstruPilot</strong> e estamos agora a analisá-lo.
    </p>
    <p style="margin:0 0 16px;line-height:1.55;">
      <strong>Resumo:</strong><br>
      <em>{{summary}}</em>
    </p>
    <p style="margin:0 0 16px;line-height:1.55;">
      {{custom_text}}
    </p>
    <p style="margin:0 0 16px;line-height:1.55;">
      Voltaremos ao contacto consigo logo que tenhamos uma resposta. Caso tenha informação adicional,
      pode responder diretamente a este email.
    </p>
    <p style="margin:24px 0 0;color:#6b7280;font-size:13px;">— Equipa ConstruPilot</p>
  </div>
</body>
</html>
