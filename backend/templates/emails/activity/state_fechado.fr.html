<!DOCTYPE html>
<html lang="fr-FR">
<head><meta charset="UTF-8"><title>Votre demande a été clôturée</title></head>
<body style="font-family: -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7f9;margin:0;padding:24px;color:#1a1a1a;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
    <h1 style="margin:0 0 12px;font-size:20px;color:#0b4b2e;">Bonjour {{nome}},</h1>
    <p style="margin:0 0 16px;line-height:1.55;">
      Votre demande sur <strong>ConstruPilot</strong> a été clôturée.
    </p>
    <p style="margin:0 0 16px;line-height:1.55;">
      <strong>Résumé :</strong><br>
      <em>{{summary}}</em>
    </p>
    <p style="margin:0 0 16px;line-height:1.55;">{{custom_text}}</p>
    <p style="margin:0 0 16px;line-height:1.55;">
      Merci de votre confiance. Pour tout nouveau besoin, créez une nouvelle demande ou répondez à cet email.
    </p>
    <p style="margin:24px 0 0;color:#6b7280;font-size:13px;">— L'équipe ConstruPilot</p>
  </div>
</body>
</html>
